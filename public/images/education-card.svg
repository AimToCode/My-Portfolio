<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="400" fill="url(#bgGradient)"/>
  <rect width="640" height="400" fill="url(#glowEffect)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Border Frame -->
  <rect x="16" y="16" width="608" height="368" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Badge: Academic Program -->
  <g transform="translate(48, 52)">
    <rect width="210" height="32" rx="16" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#22d3ee"/>
    <text x="30" y="21" fill="#22d3ee" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">B.TECH • AI &amp; ML</text>
  </g>

  <!-- Year / Batch Badge -->
  <g transform="translate(450, 52)">
    <rect width="142" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="71" y="21" fill="#d1d5db" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2025 – 2029</text>
  </g>

  <!-- Center Crest Icon -->
  <g transform="translate(48, 120)">
    <rect width="56" height="56" rx="14" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5"/>
    <path d="M44 24v10M12 24l16-8 16 8-16 8z M18 27v7c4 4 12 4 16 0v-7" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Institution Name -->
  <text x="120" y="145" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.2">
    Bansal College of Engineering
  </text>
  <text x="120" y="168" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
    Mandideep, Bhopal, Madhya Pradesh
  </text>

  <!-- Divider Line -->
  <line x1="48" y1="215" x2="592" y2="215" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Key Metrics Box (CGPA & Status) -->
  <g transform="translate(48, 245)">
    <!-- CGPA Card -->
    <rect width="260" height="90" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <text x="24" y="36" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ACADEMIC STANDING</text>
    <text x="24" y="68" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">
      7.8 <tspan fill="#22d3ee" font-size="14" font-weight="600">CGPA (First Year)</tspan>
    </text>

    <!-- Branch Card -->
    <g transform="translate(284, 0)">
      <rect width="260" height="90" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="24" y="36" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURRENT STATUS</text>
      <text x="24" y="68" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
        1st Year Undergraduate
      </text>
    </g>
  </g>
</svg>
